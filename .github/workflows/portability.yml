name: portability

# The plugin's only dependency is Python; its hook still ran through bash and GNU
# coreutils until 0.14.1, and failed at every macOS session with its errors
# discarded. Every check ran on Linux, so none saw it. This runs what a user runs -
# the hook command from hooks.json, `deadweight --fresh`, the status line - on each
# OS a user may be on.

on:
  push:
    branches: [main, "release-candidate*"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Hook, deadweight --fresh and status line on a throwaway project
        shell: bash
        run: python .github/smoke/portability.py
